# fly.toml app configuration file generated for gateway-fiihda on 2026-06-06T09:16:45Z

app = 'gateway-fiihda'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8000     # ဒီနေရာကို 8080 မှ 8000 သို့ ပြောင်းလိုက်ပါ
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
