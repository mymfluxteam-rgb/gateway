# fly.toml app configuration file generated for gateway-fiihda on 2026-06-06T09:16:45Z

app = 'gateway-fiihda'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8787     # Portkey အစစ်အမှန် run နေတဲ့ 8787 သို့ ပြောင်းလိုက်ပါ
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
# အပေါ်က code တွေရဲ့ အောက်ဆုံးမှာ ထည့်ရန်
[env]
  PORTKEY_ADMIN_TOKEN = "mysecret123"
  admin_token = "mysecret123"
