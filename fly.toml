# fly.toml app configuration file generated for gateway-fiihda on 2026-06-06T09:16:45Z

app = 'gateway-fiihda'
primary_region = 'ams'

[build]

[experimental]
  cmd = ["--admin-token", "mysecret123"]  # Dashboard ဝင်ဖို့ သုံးမယ့် Password ကို ဒီမှာ တိုက်ရိုက်သတ်မှတ်ပေးလိုက်တာဖြစ်ပါတယ်

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
